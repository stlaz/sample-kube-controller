kind: Deployment
apiVersion: apps/v1
metadata:
  name: sample-controller
  labels:
      app: examples.sample-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: examples.sample-controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: examples.sample-controller
    spec:
        serviceAccount: sample-controller-sa
        containers:
        - name: sample-controller
          image: {CONTROLLER_IMAGE}
          imagePullPolicy: IfNotPresent
---
kind: ServiceAccount
apiVersion: "v1"
metadata:
  name: sample-controller-sa
  labels:
    app: examples.sample-controller
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sample-controller-role 
  labels:
    app: examples.sample-controller
rules:
- apiGroups: ["samplecontroller.k8s.io"]
  resources: ["foos"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["samplecontroller.k8s.io"]
  resources: ["foos/status"]
  verbs: ["update"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "update", "get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "update", "patch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "sample-controller-role-binding"
  labels:
    app: examples.sample-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sample-controller-role
subjects:
- kind: ServiceAccount
  name: sample-controller-sa
  namespace: {NS}

